# Vantage configuration — the single source of truth for paths, scope and
# thresholds. Read with tomllib by vantage/config.py; prototype/config.py
# re-exports these same values so nothing is defined in two places.

[projects]
in_scope = ["en", "en.m"]

[titles]
# Non-article namespaces dropped from pageviews, matched on the prefix before
# the first colon (case-insensitive).
non_article_namespaces = [
  "Talk",
  "User", "User_talk",
  "Wikipedia", "Wikipedia_talk", "WP", "WT", "Project", "Project_talk",
  "File", "File_talk", "Image", "Image_talk", "Media",
  "MediaWiki", "MediaWiki_talk",
  "Template", "Template_talk",
  "Help", "Help_talk",
  "Category", "Category_talk",
  "Portal", "Portal_talk",
  "Draft", "Draft_talk",
  "TimedText", "TimedText_talk",
  "Module", "Module_talk",
  "Special",
]
placeholders = ["-"]

[window]
# Day 3 analysis window (UTC), by hour START; end is exclusive.
start = "2026-10-15T00"
end = "2026-10-17T00"

[spikes]
# Robust z-score over the previous baseline_hours, current hour excluded.
baseline_hours = 24
z_min = 6.0
views_floor = 1000
min_jump = 1000
# A flagged spike is also labelled likely_automated when it is desktop-dominated
# and isolated: a single hour whose neighbours are near-zero. Organic stories ramp
# and decay over neighbouring hours and skew mobile; scraper/redirect bursts don't.
desktop_share_min = 0.8
isolation_ratio = 0.05

[kafka]
# Phase 2 streaming. Broker runs in Docker (docker-compose.yml); clients run in the venv.
bootstrap_servers = "localhost:9092"
topic = "recentchange"
# 3 partitions so Spark can read with up to 3 parallel tasks and we can grow to a
# 3-broker cluster later without re-partitioning. Key = event title (set by the
# producer), so all edits to one page land on the same partition, in order.
partitions = 3
replication_factor = 1
# A page's edit history stays replayable for two weeks.
retention_days = 14
# Hard disk backstop, per partition: Kafka deletes the oldest segments past this.
# 3 partitions x 1 GiB = 3 GiB max on disk even if retention_days is never reached.
retention_bytes = 1073741824

[paths]
# All paths are relative to the project root.
raw_pageviews = "data/raw/pageviews"
raw_edits = "data/raw/edits"
interim_pageviews = "data/interim/pageviews"

[lake]
# Medallion Delta tables (Phase 1+).
bronze = "data/lake/bronze"
silver = "data/lake/silver"
gold = "data/lake/gold"
quarantine = "data/lake/quarantine"
run_metrics = "data/lake/run_metrics"
# Streaming edits Bronze (Phase 2, Day 14): raw Kafka messages + metadata, append-only.
bronze_edits = "data/lake/bronze_edits"

[checkpoints]
# Structured Streaming checkpoints (git-ignored under data/). The checkpoint is the
# stream's offset bookkeeping: it records which Kafka offsets Bronze has committed,
# so a restart resumes exactly where it left off.
edits_bronze = "data/checkpoints/edits_bronze"
