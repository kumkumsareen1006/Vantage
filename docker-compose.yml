# Single Kafka broker in KRaft mode for Phase 2 streaming. Docker runs Kafka
# only; Spark and the pipeline run in the venv (see CLAUDE.md / brief section 10).
#
#   docker compose up -d        start the broker
#   docker compose down         stop it (data survives in the named volume)
#   docker compose down -v      stop it and wipe the volume
services:
  kafka:
    # Pinned to a 3.9.x broker on purpose: Spark 3.5.9's spark-sql-kafka-0-10
    # bundles kafka-clients 3.4.1, so broker and client stay on the same 3.x line.
    image: apache/kafka:3.9.2
    container_name: vantage-kafka
    # come back automatically when Docker Desktop restarts; only a manual
    # `docker compose stop/down` keeps it down
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # advertised to clients; the Mac reaches the broker at localhost:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # single node: everything replicates once
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # off so a typo can't silently create a topic
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # laptop shares RAM with the edit capture, VS Code and Spark
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - vantage-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

volumes:
  vantage-kafka-data:
    name: vantage-kafka-data
