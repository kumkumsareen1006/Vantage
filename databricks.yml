# Databricks Asset Bundle for the Phase 3 batch job (Day 21). `databricks bundle deploy`
# syncs the repo (minus .gitignore'd paths: data/, logs/, notes/, .venv/) to the workspace
# and creates the job; `databricks bundle run vantage_batch` starts it. Host comes from the
# `vantage` CLI profile, see docs/databricks.md.
bundle:
  name: vantage

sync:
  exclude:
    - .vscode/**
    - "**/__pycache__/**"

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: vantage

resources:
  jobs:
    vantage_batch:
      name: vantage-batch
      max_concurrent_runs: 1
      # hard stop so a stuck run can't keep billing
      timeout_seconds: 7200
      tags:
        project: vantage
      # No schedule. Day 22 ran once from `schedule:` with quartz_cron_expression
      # "0 21 17 10 11 ? 2026", timezone_id America/New_York and pause_status UNPAUSED
      # (development mode pauses schedules otherwise), then the schedule was removed.
      job_clusters:
        - job_cluster_key: single_node
          new_cluster:
            # Spark 3.5 / Python 3.11, same majors as local (Spark 3.5.9, Python 3.11.6)
            spark_version: 15.4.x-scala2.12
            # 4 vCPU / 32 GB. The subscription's eastus quota is 4 vCPUs total, so one node.
            node_type_id: Standard_E4ds_v4
            num_workers: 0
            runtime_engine: STANDARD
            data_security_mode: SINGLE_USER
            single_user_name: ${workspace.current_user.userName}
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*, 4]"
            custom_tags:
              ResourceClass: SingleNode
              project: vantage
              vantage_run: day22-scheduled
            spark_env_vars:
              VANTAGE_TARGET: azure
              # DBR 15.4 defaults to Java 8, whose upper() leaves Georgian letters alone;
              # Java 17 matches the laptop and CI (docs/databricks.md, Silver parity)
              JNAME: zulu17-ca-amd64
      tasks:
        - task_key: silver_gold
          job_cluster_key: single_node
          max_retries: 0
          spark_python_task:
            python_file: scripts/run_pipeline.py
            # Bronze is already on ADLS (Day 20); the raw .gz files only exist on the laptop
            # no --full: a scheduled run only picks up new Bronze files, and Gold rebuilds when Silver moved
            parameters: ["--target", "azure", "--stages", "silver,gold"]
